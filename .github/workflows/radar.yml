name: Wohnung-Radar

# Ein Lauf prüft ~5,5 Stunden lang alle 5 Minuten und startet sich dann selbst neu.
# Der Zeitplan ist nur Reserve, falls die Kette einmal abreißt.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Radar (alle 5 Minuten)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          git config user.name "wohnung-radar"
          git config user.email "radar@users.noreply.github.com"
          end=$((SECONDS + 330*60))
          while [ $SECONDS -lt $end ]; do
            python radar.py || echo "Lauf fehlgeschlagen, weiter"
            git add seen.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Update gesehene Anzeigen"
              git pull -q --rebase && git push -q || echo "Push fehlgeschlagen, weiter"
            fi
            sleep 300
          done
      - name: Nächsten Lauf starten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run radar.yml --ref main
