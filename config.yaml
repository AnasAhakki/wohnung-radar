# Suchen: Filter auf der Website einstellen, nach "Neueste zuerst" sortieren,
# dann die Adresse aus dem Browser hier einfügen.
searches:
  - name: Kleinanzeigen
    site: kleinanzeigen
    url: "https://www.kleinanzeigen.de/s-wohnung-mieten/mannheim/sortierung:neuste/anzeige:angebote/preis::1100/c203l7971+wohnung_mieten.zimmer_d:2.0,2.5"
  - name: WG-Gesucht
    site: wg-gesucht
    url: "https://www.wg-gesucht.de/wohnungen-in-Mannheim.85.2.1.0.html?offer_filter=1&city_id=85&sort_order=0&noDeact=1&categories%5B%5D=2&rMax=1200&rmMin=2&rmMax=2"

filter:
  min_rooms: 2
  max_rooms: 2.5
  max_warm: 1200            # Euro
  assumed_nk_if_unknown: 200 # wenn nur Kaltmiete bekannt ist

# Bewertung nach Kaltmiete pro m².
# Mannheim 2026: Ø Angebotsmiete 2 Zimmer ca. 12,50–13 €/m².
rating:
  suspicious_below: 7.0
  cheap_up_to: 11.0
  fair_up_to: 14.0

max_details_per_run: 30
